<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Puzzle</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/styles.css">

    <!-- Favicon -->
    <link rel="icon" href="../static/images/favicon.svg" type="image/svg+xml" />
</head>

<body class="min-h-screen flex flex-col">

    <!-- Top App Bar -->
    <header
        class="sticky top-0 z-50 backdrop-blur-md bg-opacity-90 px-4 py-3 flex justify-between items-center shadow-sm"
        style="background-color: var(--md-sys-color-surface);">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-3xl"
                style="color: var(--md-sys-color-primary);">extension</span>
            <h1 class="text-xl font-medium tracking-tight">Pixel Puzzle</h1>
        </div>
        <a href="https://github.com/your-repo/pixel-puzzle" target="_blank"
            class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors" title="View Source">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path fill-rule="evenodd"
                    d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                    clip-rule="evenodd" />
            </svg>
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-lg rounded-[28px] overflow-hidden shadow-xl"
            style="background-color: var(--md-sys-color-surface-variant);">

            <!-- Navigation Tabs -->
            <div class="flex overflow-x-auto" role="tablist" style="background-color: var(--md-sys-color-surface);">
                <button onclick="setMode('encode')" id="tab-encode"
                    class="md-tab active flex-1 py-4 text-sm font-medium text-center hover:bg-black/5 dark:hover:bg-white/5 transition-colors">Encode</button>
                <button onclick="setMode('decode')" id="tab-decode"
                    class="md-tab flex-1 py-4 text-sm font-medium text-center hover:bg-black/5 dark:hover:bg-white/5 transition-colors">Decode</button>
                <button onclick="setMode('shuffle')" id="tab-shuffle"
                    class="md-tab flex-1 py-4 text-sm font-medium text-center hover:bg-black/5 dark:hover:bg-white/5 transition-colors">Shuffle</button>
                <button onclick="setMode('recover')" id="tab-recover"
                    class="md-tab flex-1 py-4 text-sm font-medium text-center hover:bg-black/5 dark:hover:bg-white/5 transition-colors">Recover</button>
            </div>

            <!-- Form Container -->
            <div class="p-6 md:p-8 flex flex-col gap-6" style="background-color: var(--md-sys-color-surface);">

                <div class="text-center">
                    <h2 id="form-title" class="text-2xl text-[var(--md-sys-color-on-surface)]">Encode Image</h2>
                    <p id="form-desc" class="text-sm mt-1 text-[var(--md-sys-color-on-surface-variant)]">Convert an
                        image to Base64 text.</p>
                </div>

                <form id="pixelForm" onsubmit="handleSubmit(event)" class="flex flex-col gap-5">

                    <!-- File Drop Zone -->
                    <div id="drop-zone"
                        class="border-2 border-dashed rounded-xl p-6 text-center transition-colors cursor-pointer"
                        style="border-color: var(--md-sys-color-outline);"
                        onclick="document.getElementById('file-input').click()"
                        ondragover="event.preventDefault(); this.style.borderColor = 'var(--md-sys-color-primary)';"
                        ondragleave="this.style.borderColor = 'var(--md-sys-color-outline)';">

                        <span class="material-symbols-outlined text-4xl mb-2"
                            style="color: var(--md-sys-color-primary);">cloud_upload</span>
                        <p class="text-sm font-medium mb-1">Click or drag file here</p>
                        <p id="file-name" class="text-xs text-[var(--md-sys-color-on-surface-variant)] opacity-70">No
                            file selected</p>
                        <input type="file" id="file-input" class="hidden" required onchange="updateFileName(this)">
                    </div>

                    <!-- Seed Input (Conditional) -->
                    <div id="seed-container" class="hidden">
                        <div class="md-input-container rounded-t-lg px-4 pt-5 pb-2 relative h-14 w-full bg-opacity-10 dark:bg-opacity-10"
                            style="background-color: var(--md-sys-color-surface-variant);">
                            <input type="number" id="seed-input" placeholder=" "
                                class="md-input w-full bg-transparent border-none outline-none text-base h-full absolute bottom-0 left-4 z-10"
                                style="color: var(--md-sys-color-on-surface-variant);">
                            <label for="seed-input"
                                class="md-input-label absolute left-4 top-4 text-base pointer-events-none z-0">Seed
                                (Required)</label>
                        </div>
                        <p class="text-xs mt-1 ml-4" style="color: var(--md-sys-color-on-surface-variant);">Must be an
                            integer.</p>
                    </div>

                    <!-- Image Quality Input (Conditional for Shuffle/Recover) -->
                    <div id="quality-container" class="hidden">
                        <div class="md-input-container rounded-t-lg px-4 pt-5 pb-2 relative h-14 w-full bg-opacity-10 dark:bg-opacity-10"
                            style="background-color: var(--md-sys-color-surface-variant);">
                            <select id="quality-input"
                                class="md-input w-full bg-transparent border-none outline-none text-base h-full absolute bottom-0 left-4 z-10"
                                style="color: var(--md-sys-color-on-surface-variant); -webkit-appearance: none; appearance: none;">
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high" selected>High</option>
                            </select>
                            <label for="quality-input" class="md-input-label absolute left-4 top-1 text-xs z-0"
                                style="color: var(--md-sys-color-primary);">Image Quality (Required)</label>
                            <!-- Dropdown Icon -->
                            <span class="material-symbols-outlined absolute right-4 top-4 pointer-events-none"
                                style="color: var(--md-sys-color-on-surface-variant);">arrow_drop_down</span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn"
                        class="md-filled-button h-12 rounded-full w-full font-medium text-sm tracking-wide uppercase flex justify-center items-center gap-2 transition-transform active:scale-95">
                        <span id="btn-text">Encode</span>
                        <div id="loader" class="spinner hidden"></div>
                    </button>
                </form>

                <!-- Feedback Area -->
                <div id="error-msg"
                    class="hidden p-4 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-200 text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">error</span>
                    <span id="error-text">Error processing request.</span>
                </div>
            </div>
        </div>
    </main>

    <script src="../static/js/scripts.js"></script>
</body>

</html>
